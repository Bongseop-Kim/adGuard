<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>adGuard 불법광고 점검 보고서</title>
<!-- 앱 화면(pywebview)과 단일 HTML 보고서가 함께 쓰는 렌더러 (todo/06).
     보고서는 아래 id="data" 자리에 결과 JSON이 들어간다. 원문은 모두 textContent로만 넣는다 (innerHTML 금지) -->
<style>
:root {
  --bg: #f4f6f9; --card: #fff; --ink: #1b2430; --sub: #5b6676; --line: #dde3ea; --brand: #1f4e8c;
  --crit: #c62828; --crit-bg: #fdecec; --warn: #d35400; --warn-bg: #fff1e6; --info: #2f6db3; --info-bg: #e9f1fb;
  --ok: #1e7e34; --ok-bg: #e7f5ea; --mark: #ffe08a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
header.top { background: var(--brand); color: #fff; padding: 12px 24px; display: flex; gap: 12px; align-items: baseline; }
header.top b { font-size: 18px; letter-spacing: .3px; }
header.top span { opacity: .85; font-size: 13px; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 12px; }
h2 { font-size: 18px; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
h3 { font-size: 15px; margin: 18px 0 6px; color: var(--sub); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
button, .btn { font: inherit; border: 1px solid var(--brand); background: #fff; color: var(--brand); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--brand); color: #fff; font-weight: 600; padding: 10px 22px; font-size: 16px; }
button:disabled { opacity: .5; cursor: default; }
input, select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: #fff; }
code, pre { font: 13px/1.5 Consolas, "D2Coding", Menlo, monospace; }
pre { background: #f7f8fa; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-all; max-height: 260px; margin: 0; }
.muted { color: var(--sub); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* R1 시작 */
#start .card { max-width: 760px; margin: 40px auto; padding: 32px; }
#start form { display: flex; gap: 8px; margin: 12px 0; }
#start input#url { flex: 1; font-size: 16px; padding: 12px 14px; }
details.opt { margin-top: 12px; }
details.opt summary { cursor: pointer; color: var(--sub); }
details.opt label { display: block; margin: 10px 0 0; }
details.opt input { width: 80px; padding: 5px 8px; }

/* R2 진행 */
#progress .card { max-width: 760px; margin: 40px auto; }
.state { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.state.done { color: var(--ok); }
.state.err { color: var(--crit); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 14px 0; }
.bar i { display: block; height: 100%; width: 30%; background: var(--brand); border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
.bar.full i { width: 100%; animation: none; background: var(--ok); }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .4; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--sub); }

/* R3 요약 */
.done-banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--ok-bg); border: 1px solid #b9e0c2; color: var(--ok); border-radius: 10px; padding: 12px 18px; font-weight: 600; }
.cond { display: grid; grid-template-columns: max-content 1fr max-content 1fr; gap: 4px 16px; font-size: 14px; }
.cond dt { color: var(--sub); }
.cond dd { margin: 0; word-break: break-all; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; border-top: 4px solid var(--line); }
.tile b { display: block; font-size: 28px; line-height: 1.2; }
.tile span { color: var(--sub); font-size: 13px; }
.tile.crit { border-top-color: var(--crit); } .tile.crit b { color: var(--crit); }
.tile.warn { border-top-color: var(--warn); } .tile.warn b { color: var(--warn); }
.tile.info { border-top-color: var(--info); } .tile.info b { color: var(--info); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.hbar { display: grid; grid-template-columns: 150px 1fr 36px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
.hbar div { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
.hbar div i { display: block; height: 100%; background: var(--brand); }
.hbar em { font-style: normal; text-align: right; font-weight: 600; }
.urls li { word-break: break-all; font-size: 14px; margin: 4px 0; }
.clean { text-align: center; padding: 36px; }
.clean b { font-size: 22px; color: var(--ok); display: block; margin-bottom: 6px; }

/* R4 목록 */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.filters input { flex: 1; min-width: 200px; }
table { border-collapse: collapse; width: 100%; background: var(--card); }
table.list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.list th { background: #eef1f5; text-align: left; font-size: 13px; color: var(--sub); padding: 8px 10px; white-space: nowrap; }
table.list td { border-top: 1px solid var(--line); padding: 9px 10px; vertical-align: top; font-size: 14px; }
table.list tr.g { cursor: pointer; }
table.list tr.g:hover td { background: #f6f9fd; }
table.list tr.g.open td { background: #eef4fc; }
.ev { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-심각 { background: var(--crit-bg); color: var(--crit); }
.b-위험 { background: var(--warn-bg); color: var(--warn); }
.b-참고 { background: var(--info-bg); color: var(--info); }
.cause-hack { color: var(--crit); font-weight: 600; }
.chev { color: var(--sub); }

/* R5~R7 상세 */
td.detail { background: #fbfcfe; padding: 0 !important; }
.det { padding: 16px 18px 20px; display: grid; gap: 4px; }
.summary { background: #fff; border-left: 4px solid var(--brand); padding: 10px 14px; font-weight: 600; border-radius: 4px; }
.raw { font-size: 16px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; word-break: break-all; }
.raw mark { background: var(--mark); border-bottom: 2px solid var(--warn); padding: 0 1px; }
table.kv td, table.kv th { border: 1px solid var(--line); padding: 4px 8px; font-size: 13px; text-align: left; }
table.kv th { background: #f2f4f7; font-weight: 600; width: 180px; }
.chips span { display: inline-block; background: var(--crit-bg); color: var(--crit); border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 13px; }
.shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.shots figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.shots img { max-width: 100%; display: block; border: 1px solid var(--line); }
.shots figcaption { font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
.locs li { margin: 6px 0; font-size: 14px; }
.locs code { background: #f2f4f7; padding: 1px 6px; border-radius: 4px; word-break: break-all; }
.locs button { padding: 1px 8px; font-size: 12px; margin-left: 6px; }
.guide { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px 6px 32px; margin: 0; }
.guide li { margin: 4px 0; }
.ai td, .ai th { border: 1px solid var(--line); padding: 6px 10px; text-align: left; font-size: 14px; }
.ai th { background: #f2f4f7; width: 260px; }
.limits li { margin: 4px 0; color: var(--sub); }
footer { margin-top: 32px; color: var(--sub); font-size: 12px; text-align: center; }
[hidden] { display: none !important; }

@media (max-width: 760px) {
  .tiles, .stats { grid-template-columns: 1fr 1fr; }
  .two, .shots { grid-template-columns: 1fr; }
  .cond { grid-template-columns: max-content 1fr; }
  .ev { max-width: 180px; }
}
@media print {
  body { background: #fff; }
  header.top, .noprint, .filters { display: none !important; }
  .card, .tile, table.list { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="top"><b>adGuard</b><span>공공 웹사이트 불법광고 탐지 도구 · 되고시스템</span></header>
<main>
  <section id="start" hidden>
    <div class="card">
      <h1>점검할 웹사이트 주소를 입력하세요</h1>
      <div class="muted">입력한 주소에서 시작해 하위 페이지, 게시글, 댓글, iframe 안까지 자동으로 살펴보고 숨겨지거나 변형된 불법광고를 찾습니다.</div>
      <form onsubmit="start(); return false;">
        <input id="url" placeholder="https://www.example.go.kr" autocomplete="url" autofocus>
        <button id="go" class="primary" type="submit">탐지 시작</button>
      </form>
      <div id="urlmsg" class="muted" style="color:var(--crit)"></div>
      <details class="opt">
        <summary>옵션</summary>
        <label>시간 상한 <input id="minutes" type="number" min="1" max="30" value="20"> 분 &nbsp;<span class="muted">상한에 닿으면 그때까지 찾은 결과를 저장합니다.</span></label>
      </details>
      <p class="muted" style="margin-top:20px">결과 파일은 프로그램 폴더에 저장됩니다: result.json(제출 형식), report.html(보고서), result.csv(Excel).</p>
    </div>
  </section>

  <section id="progress" hidden>
    <div class="card">
      <div id="st" class="state">탐지 중…</div>
      <div id="stsub" class="muted"></div>
      <div id="bar" class="bar"><i></i></div>
      <div class="stats">
        <div class="stat"><b id="p-visited">0</b><span>살펴본 페이지</span></div>
        <div class="stat"><b id="p-queue">0</b><span>남은 대기 주소</span></div>
        <div class="stat"><b id="p-found">0</b><span>검출</span></div>
        <div class="stat"><b id="p-time">0초</b><span>경과 시간</span></div>
      </div>
      <div class="row">
        <button id="stopbtn" onclick="stopScan()">중단 (그때까지 결과 저장)</button>
      </div>
      <details style="margin-top:14px"><summary class="muted" style="cursor:pointer">진행 기록</summary><pre id="log"></pre></details>
    </div>
  </section>

  <section id="result" hidden></section>
</main>
<script type="application/json" id="data">null</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
// 요소 만들기. 문자열 자식은 텍스트 노드로만 들어간다 (광고 원문에 HTML이 섞여도 실행·해석되지 않음)
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const show = id => { for (const s of ['start', 'progress', 'result']) $('#' + s).hidden = s !== id; };
const fmtSec = s => s < 60 ? Math.round(s) + '초' : Math.floor(s / 60) + '분 ' + Math.round(s % 60) + '초';
const fmtTime = t => (t || '').replace('T', ' ').replace(/\+09:00$/, '');

const TECH_DESC = {
  HOMOGLYPH: '키릴·그리스 문자, 전각 문자, 숫자 등 생김새가 비슷한 글자로 바꿔 써서 금칙어 필터를 피하는 기법입니다. (예: 카지노 → саsіnо)',
  JAMO: '음절을 자모 단위로 쪼개거나 초성만 써서 키워드 검색을 피하는 기법입니다. (예: 카지노 → ㅋㅏㅈㅣㄴㅗ, ㅋㅈㄴ)',
  TRANSPARENT: '글자색을 배경색과 같게 하거나 opacity:0, color:transparent 등으로 사람 눈에는 안 보이게 숨기는 기법입니다. 검색엔진에는 읽혀 사이트 이름으로 광고가 노출됩니다.',
  OFFSCREEN: 'position:absolute; left:-9999px 처럼 화면 밖으로 밀거나, font-size 0~1px, display:none, 크기 0 상자 등으로 숨기는 기법입니다.',
};
const TECHS = ['HOMOGLYPH', 'JAMO', 'TRANSPARENT', 'OFFSCREEN'];
const TECH_KO = { HOMOGLYPH: '유사 문자 치환', JAMO: '자모 분리', TRANSPARENT: '투명·배경색 숨김', OFFSCREEN: '화면 밖·크기 0 숨김' };
const RISK_DESC = { '심각': '여러 페이지 같은 위치(해킹 삽입 의심)', '위험': '숨겨진 광고', '참고': '보이는 변형 광고' };
const LIMITS = [
  '로그인해야 볼 수 있는 영역, 관리자 화면, 비밀글은 점검하지 않습니다.',
  '서버 내부 파일(웹셸, 백업 파일, DB)은 점검하지 않습니다. 해킹 삽입 의심이면 서버 점검을 따로 받아야 합니다.',
  '이미지·동영상·PDF 속 글자, canvas로 그린 글자는 읽지 않습니다.',
  '같은 형식의 주소가 아주 많으면(날짜별 달력 등) 일부만 표본으로 봅니다. 시간 상한에 닿으면 그 뒤 페이지는 보지 못합니다.',
  '방문자·시간·접속 지역에 따라 다른 내용을 보여주는 페이지는 점검 시점의 화면만 반영합니다.',
  '판정은 키워드·연락처 패턴과 화면 렌더링 규칙에 따른 것으로, 최종 위반 여부는 담당자가 확인해야 합니다.',
  '숨김 드러내기 캡처는 점검 뒤 페이지를 다시 열어 찍으므로, 그사이 내용이 바뀌면 캡처가 없을 수 있습니다.',
];

// 앱(pywebview 또는 예비 서버)에서 Python 부르기
function api(name, ...args) {
  if (window.pywebview && window.pywebview.api) return window.pywebview.api[name](...args);
  return fetch(location.pathname + 'api/' + name, { method: 'POST', body: JSON.stringify(args) }).then(r => r.json());
}
const APP = () => !!(window.pywebview || location.protocol.startsWith('http'));

function start() {
  const url = $('#url').value.trim();
  if (!url) { $('#urlmsg').textContent = '점검할 주소를 입력하세요.'; return; }
  $('#urlmsg').textContent = '';
  $('#go').disabled = true;
  $('#stopbtn').disabled = false;
  $('#log').textContent = '';
  Promise.resolve(api('start', url, +$('#minutes').value || 20)).then(() => { show('progress'); poll(); });
}
function stopScan() { $('#stopbtn').disabled = true; api('stop'); }

function poll() {
  api('state').then(s => {
    $('#p-visited').textContent = s.visited || 0;
    $('#p-queue').textContent = s.queue || 0;
    $('#p-found').textContent = s.found || 0;
    $('#p-time').textContent = fmtSec(s.elapsed || 0);
    $('#log').textContent = (s.log || []).join('\n');
    const st = $('#st');
    st.className = 'state';
    $('#bar').className = 'bar';
    if (s.phase === 'running') {
      st.textContent = s.stopping ? '중단하는 중…' : '탐지 중…';
      $('#stsub').textContent = s.stopping ? '진행 중인 페이지를 마친 뒤 그때까지의 결과를 저장합니다.' : (s.url || '');
    } else if (s.phase === 'report') {
      st.textContent = '✔ 탐지 완료';
      st.classList.add('done');
      $('#bar').classList.add('full');
      $('#stsub').textContent = '검출 ' + (s.found || 0) + '건 · 소요 ' + fmtSec(s.elapsed || 0) + ' · result.json 저장됨. 보고서와 숨김 드러내기 캡처를 만드는 중입니다…';
      $('#stopbtn').disabled = true;
    } else if (s.phase === 'error') {
      st.textContent = '오류로 점검을 마치지 못했습니다';
      st.classList.add('err');
      $('#stsub').textContent = '진행 기록을 확인하세요. 그때까지의 결과는 result.json에 저장되어 있습니다.';
      $('#go').disabled = false;
      return;
    }
    if (s.phase === 'ready') { renderReport(s.data); show('result'); window.scrollTo(0, 0); return; }
    setTimeout(poll, 500);
  }).catch(() => setTimeout(poll, 1000));
}

// ---------- 결과(앱 화면 = 보고서) ----------
function renderReport(D) {
  const m = D.meta, G = D.groups, root = $('#result');
  root.textContent = '';
  const urlsOf = g => [...new Set(g.items.map(i => i.url))];

  // 완료 표시 + 내보내기
  const actions = APP() ? h('div', { class: 'row noprint' },
    h('button', { onclick: () => api('open', 'report') }, 'HTML 보고서 열기'),
    h('button', { onclick: () => api('open', 'csv') }, 'Excel(CSV) 열기'),
    h('button', { onclick: () => api('open', 'json') }, 'result.json 열기'),
    h('button', { onclick: () => api('open', 'folder') }, '결과 폴더'),
    h('button', { onclick: () => { $('#go').disabled = false; show('start'); } }, '새 점검')) : null;
  root.append(h('div', { class: 'done-banner' },
    h('span', {}, (m.stopped ? '■ 중단됨 — 중단 시점까지의 결과' : '✔ 탐지 완료') + ' · 소요 ' + fmtSec(m.elapsed_sec)), actions));

  root.append(h('h2', {}, '점검 조건'));
  const cond = [['점검 대상', m.entry_url], ['살펴본 페이지', m.visited + '쪽'],
    ['탐지 시작', fmtTime(m.started_at)], ['탐지 완료', fmtTime(m.finished_at)],
    ['소요 시간', fmtSec(m.elapsed_sec) + (m.stopped ? ' (사용자 중단)' : '')], ['시간 상한', m.minutes + '분'],
    ['도구 버전', 'adGuard ' + m.tool_version], ['AI 판정', D.ai.enabled ? '켜짐 (' + (D.ai.model || '') + ')' : '꺼짐'],
    ['보고서 생성', fmtTime(m.report_at)], ['판정 방식', '규칙 기반(키워드·연락처 패턴 + 렌더링 결과)']];
  root.append(h('div', { class: 'card' }, h('dl', { class: 'cond' }, cond.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]))));

  // R3 요약
  root.append(h('h2', {}, '요약'));
  if (!G.length) {
    root.append(h('div', { class: 'card clean' }, h('b', {}, '불법광고가 발견되지 않았습니다'),
      h('span', { class: 'muted' }, m.visited + '쪽을 살펴봤습니다. 아래 "점검하지 않는 범위"를 함께 확인하세요.')));
  } else {
    const cnt = r => G.filter(g => g.risk === r).length;
    root.append(h('div', { class: 'tiles' },
      h('div', { class: 'tile' }, h('b', {}, m.findings), h('span', {}, '검출 (위치 기준 · result.json 건수)')),
      ...['심각', '위험', '참고'].map((r, i) => h('div', { class: 'tile ' + ['crit', 'warn', 'info'][i] },
        h('b', {}, cnt(r)), h('span', {}, r + ' · ' + RISK_DESC[r])))));
    const byTech = TECHS.map(t => [t, G.filter(g => g.technique === t).reduce((a, g) => a + g.items.length, 0)]);
    const max = Math.max(1, ...byTech.map(x => x[1]));
    const pages = {};
    for (const g of G) for (const i of g.items) pages[i.url] = (pages[i.url] || 0) + 1;
    const top = Object.entries(pages).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const hack = G.filter(g => g.cause === '해킹 삽입 의심').length;
    root.append(h('div', { class: 'two' },
      h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '기법별 검출'),
        byTech.map(([t, n]) => h('div', { class: 'hbar' }, h('span', {}, TECH_KO[t]), h('div', {}, h('i', { style: 'width:' + (n / max * 100) + '%' })), h('em', {}, n)))),
      h('div', { class: 'card' }, h('h3', { style: 'margin-top:0' }, '검출이 많은 페이지'),
        h('ol', { class: 'urls' }, top.map(([u, n]) => h('li', {}, u + ' — ' + n + '건'))),
        h('div', { class: hack ? 'cause-hack' : 'muted' }, hack ? '⚠ 해킹 삽입 의심 ' + hack + '묶음: 여러 페이지 같은 위치에 같은 광고가 있습니다. 서버 점검이 필요합니다.' : '해킹 삽입 의심(여러 페이지 같은 위치) 없음'))));

    // R4 목록
    root.append(h('h2', {}, '검출 목록 ', h('span', { class: 'muted' }, '같은 광고 문구는 한 줄로 묶었습니다. 줄을 누르면 근거·캡처·조치 방법이 나옵니다.')));
    const q = h('input', { placeholder: '원문·URL·위치 검색', oninput: () => fill() });
    const fr = h('select', { onchange: () => fill() }, h('option', { value: '' }, '위험도 전체'), ['심각', '위험', '참고'].map(r => h('option', { value: r }, r)));
    const ft = h('select', { onchange: () => fill() }, h('option', { value: '' }, '기법 전체'), TECHS.map(t => h('option', { value: t }, TECH_KO[t])));
    root.append(h('div', { class: 'filters noprint' }, q, fr, ft));
    const tbody = h('tbody');
    root.append(h('table', { class: 'list' }, h('thead', {}, h('tr', {},
      ['위험도', '기법', '원인 유형', '광고 원문', '영향 페이지', '최초 발견', ''].map(x => h('th', {}, x)))), tbody));
    const fill = () => {
      tbody.textContent = '';
      const s = q.value.trim().toLowerCase();
      const rows = G.filter(g => (!fr.value || g.risk === fr.value) && (!ft.value || g.technique === ft.value) &&
        (!s || [g.evidence_text, g.norm, ...g.items.flatMap(i => [i.url, i.location])].join('\n').toLowerCase().includes(s)));
      if (!rows.length) tbody.append(h('tr', {}, h('td', { colspan: 7, class: 'muted' }, '조건에 맞는 검출이 없습니다.')));
      for (const g of rows) {
        const det = h('tr', { hidden: true }, h('td', { colspan: 7, class: 'detail' }));
        const tr = h('tr', { class: 'g', title: '눌러서 근거 보기' },
          h('td', {}, h('span', { class: 'badge b-' + g.risk }, g.risk)),
          h('td', {}, g.tech_label, h('div', { class: 'muted' }, g.technique)),
          h('td', { class: g.cause === '해킹 삽입 의심' ? 'cause-hack' : '' }, g.cause),
          h('td', {}, h('div', { class: 'ev' }, g.evidence_text)),
          h('td', {}, urlsOf(g).length + '쪽', g.items.length > urlsOf(g).length ? h('div', { class: 'muted' }, '위치 ' + g.items.length + '곳') : null),
          h('td', { class: 'muted' }, fmtTime(g.first_seen).slice(0, 10)),
          h('td', { class: 'chev' }, '▾'));
        tr.onclick = () => {
          const open = det.hidden;
          det.hidden = !open;
          tr.classList.toggle('open', open);
          if (open && !det.firstChild.firstChild) det.firstChild.append(detail(g, D));
        };
        tbody.append(tr, det);
      }
    };
    fill();
  }

  // R7 조치 안내 (전체)
  root.append(h('h2', {}, '조치 안내'));
  root.append(h('div', { class: 'card' }, Object.entries(D.guide).map(([k, v]) =>
    h('details', { open: G.some(g => g.cause === k) || (G.length && k === '검색엔진 흔적') || null },
      h('summary', { style: 'cursor:pointer;font-weight:600;margin:6px 0' }, k),
      h('ol', { class: 'guide' }, v.map(x => h('li', {}, x)))))));

  // R20 AI 사용 명세
  root.append(h('h2', {}, 'AI 사용 명세'));
  root.append(h('div', { class: 'card' }, D.ai.enabled
    ? h('table', { class: 'ai' }, (D.ai.rows || []).map(([k, v]) => h('tr', {}, h('th', {}, k), h('td', {}, v))))
    : [h('b', {}, 'AI: 꺼짐'), h('div', { class: 'muted' }, D.ai.reason)]));

  // R19 한계 고지
  root.append(h('h2', {}, '점검하지 않는 범위 (한계)'));
  root.append(h('div', { class: 'card' }, h('ul', { class: 'limits' }, LIMITS.map(x => h('li', {}, x)))));
  root.append(h('footer', {}, 'adGuard ' + m.tool_version + ' · 되고시스템(Duegosystem) · 보고서 생성 ' + fmtTime(m.report_at)));
}

// R5·R6·R7: 묶음 하나의 근거 상세
function detail(g, D) {
  const odd = new Map(g.chars.map(([c, code, name]) => [c, code + ' ' + name]));
  const raw = h('div', { class: 'raw' });
  let buf = '';
  for (const c of g.evidence_text) {
    if (odd.has(c)) { if (buf) raw.append(buf); buf = ''; raw.append(h('mark', { title: odd.get(c) }, c)); }
    else buf += c;
  }
  if (buf) raw.append(buf);
  const hidden = g.technique === 'TRANSPARENT' || g.technique === 'OFFSCREEN';
  const sh = g.shot || {};
  const img = src => typeof src === 'string' && src.startsWith('data:image/') ? h('img', { src, alt: '' }) : h('div', { class: 'muted' }, '이미지 없음');
  const copy = (t, b) => {
    const done = () => { b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => prompt('선택자', t));
    else prompt('선택자', t);
  };
  const styleRows = Object.entries(g.style || {}).filter(([, v]) => v && v !== 'none' && v !== 'auto' && v !== 'normal');
  return h('div', { class: 'det' },
    h('div', { class: 'summary' }, g.summary),
    h('h3', {}, '광고 원문 (수집한 그대로, 표시된 글자는 마우스를 올리면 문자 정보)'), raw,
    g.chars.length ? [h('h3', {}, '변형·특수 글자'), h('table', { class: 'kv' },
      h('tr', {}, h('th', {}, '글자'), h('th', {}, '코드'), h('th', {}, '이름')),
      g.chars.map(([c, code, name]) => h('tr', {}, h('td', {}, c.trim() ? c : '(보이지 않는 글자)'), h('td', {}, code), h('td', {}, name))))] : null,
    g.norm ? [h('h3', {}, '정규화 결과 (변형을 풀어 읽은 글)'), h('div', { class: 'raw' }, g.norm)] : null,
    g.kw.length ? [h('h3', {}, '광고로 판단한 키워드'), h('div', { class: 'chips' }, g.kw.map(k => h('span', {}, k)))] : null,
    h('h3', {}, (hidden ? '숨김 근거' : '변형 근거') + ' — ' + g.tech_label), h('div', {}, g.reason || '-'),
    h('div', { class: 'muted' }, TECH_DESC[g.technique]),
    hidden && styleRows.length ? [h('h3', {}, '계산된 스타일 (브라우저가 실제로 적용한 값)'),
      h('table', { class: 'kv' }, styleRows.map(([k, v]) => h('tr', {}, h('th', {}, k), h('td', {}, v))))] : null,
    h('h3', {}, hidden ? '숨김 드러내기' : '광고 위치'),
    sh.before ? h('div', { class: 'shots' },
      h('figure', {}, h('figcaption', {}, hidden ? '① 이용자에게 보이는 화면' : '① 이용자에게 보이는 화면'), img(sh.before)),
      h('figure', {}, h('figcaption', {}, hidden ? '② 숨김을 해제한 화면 (빨간 테두리가 광고)' : '② 광고 위치 표시 (빨간 테두리)'), img(sh.after)))
      : h('div', { class: 'muted' }, sh.error || '캡처 없음'),
    g.html ? [h('h3', {}, 'HTML 조각'), h('pre', {}, g.html)] : null,
    h('h3', {}, '발견 위치 ' + g.items.length + '곳'),
    h('ul', { class: 'locs' }, g.items.map(i => {
      const b = h('button', { class: 'noprint' }, '복사');
      b.onclick = e => { e.stopPropagation(); copy(i.location, b); };
      return h('li', {}, h('span', { class: 'muted' }, i.id + ' '),
        /^https?:/i.test(i.url) ? h('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer' }, i.url) : i.url,
        h('br'), h('code', {}, i.location), b);
    })),
    h('h3', {}, '조치 방법 — ' + g.cause),
    h('ol', { class: 'guide' }, [...(D.guide[g.cause] || []), ...(D.guide['검색엔진 흔적'] || [])].map(x => h('li', {}, x))),
    h('div', { class: 'muted' }, '지문 ' + g.fp + ' · 최초 발견 ' + fmtTime(g.first_seen)));
}

// 시작: 보고서 파일이면 내장 JSON을, 앱이면 시작 화면을
const EMBED = JSON.parse($('#data').textContent);
if (EMBED) { document.title = 'adGuard 점검 보고서 — ' + EMBED.meta.entry_url; renderReport(EMBED); show('result'); }
else { document.title = 'adGuard 불법광고 탐지'; show('start'); }
</script>
</body>
