    const LV = { '위험': 'b-위험', '참고': 'b-참고', '안전': 'b-ok', '판정 불가': 'b-fail' };
    for (const d of D.diag) {
      C.append(h('h3', {}, d.name + ' ', h('span', { class: 'badge ' + (LV[d.level] || 'b-fail') }, d.level)));
      C.append(h('p', {}, d.summary));
      if (d.rows.length) C.append(h('dl', { class: 'cond' }, d.rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])));
      if (d.advice.length) C.append(h('ol', { class: 'guide' }, d.advice.map(x => h('li', {}, x))));
    }
  }

  // AI 사용 명세 (research/10 §2-1): 무엇을 얼마나 보냈고 무엇이 바뀌었나
  if (D.ai.enabled) {
    C.append(sec('s-ai', 'AI 사용 명세', '규칙만으로 애매한 후보만 OpenAI Decisions API에 물었습니다. 연락처·계정·주소는 종류만 남기고 가려서 보냈고, 규칙이 연락처까지 찾은 광고는 AI가 뒤집지 못합니다.'));
    C.append(h('dl', { class: 'cond' }, D.ai.rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])));
    if (D.ai.changed.length) {
      C.append(h('h3', {}, 'AI가 바꾼 판정'));
      C.append(h('ol', { class: 'guide' }, D.ai.changed.map(x => h('li', {},
        (x.rule ? '규칙 광고 → AI 광고 아님' : '규칙 광고 아님 → AI 광고') + ' (q ' + x.q.toFixed(2) + '): ' + x.text,
        h('div', { class: 'muted' }, '보낸 글: ' + x.sent)))));
    }
  }

  // R7 조치 안내: 이번 점검에 나온 원인 유형만. 검색엔진 흔적은 항목마다 붙으므로 검출이 있으면 함께
  const causes = new Set(G.map(g => g.cause));
  if (G.length) causes.add('검색엔진 흔적');
  if (G.some(g => g.tech_label.includes('내부 검색'))) causes.add('내부 검색 결과 악용');
  const guides = Object.entries(D.guide).filter(([k]) => causes.has(k));
  if (guides.length) {
    C.append(sec('s-guide', '조치 안내'));
    C.append(h('div', {}, guides.map(([k, v]) =>
      [h('h3', {}, k), h('ol', { class: 'guide' }, v.map(x => h('li', {}, x)))])));
  }

  // 점검 조건: 부가 정보라 뒤에 둔다
  C.append(sec('s-cond', '점검 조건'));
  const cond = [['점검 대상', m.entry_url], ['살펴본 페이지', m.visited + '쪽'],
    ['탐지 시작', fmtTime(m.started_at)], ['탐지 완료', fmtTime(m.finished_at)],
    ['소요 시간', fmtSec(m.elapsed_sec) + (m.stopped ? ' (사용자 중단)' : '')], ['시간 상한', m.minutes + '분'],
    ['도구 버전', 'adGuard ' + m.tool_version], ['AI 결정 모델', D.ai.enabled ? '켜짐 (' + (D.ai.model || '') + ')' : '꺼짐 · ' + (D.ai.reason || '')],
    ['보고서 생성', fmtTime(m.report_at)], ['판정 방식', D.ai.enabled ? '규칙 기반 + 경계 후보만 AI(q ≥ 0.4)' : '규칙 기반(키워드·연락처 패턴 + 렌더링 결과)']];
  C.append(h('dl', { class: 'cond' }, cond.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])));

  C.append(h('footer', {}, 'adGuard ' + m.tool_version + ' · 보고서 생성 ' + fmtTime(m.report_at)));

  // 이 페이지의 구성: 누르면 그 절로 초점 이동, 스크롤하면 지금 절 표시
  const links = toc.map(([id, t]) => h('a', { href: '#' + id, onclick: e => { e.preventDefault(); const el = document.getElementById(id); el.scrollIntoView(); el.focus({ preventScroll: true }); } }, t));
  const nav = h('nav', { class: 'toc', 'aria-labelledby': 'toc-h' }, h('h2', { id: 'toc-h' }, '이 페이지의 구성'), h('ul', {}, links.map(a => h('li', {}, a))));
  root.append(h('div', { class: 'rwrap' }, C, nav));
  const io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) links.forEach(a => a.hash === '#' + e.target.id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
  }, { rootMargin: '0px 0px -70% 0px' });
  toc.forEach(([id]) => io.observe(document.getElementById(id)));
}

// 새 창 링크 (KRDS 상세 정보: 새 창으로 열리면 아이콘으로 알린다)
function newWin(href, text, attrs) {
  const a = h('a', { href, target: '_blank', rel: 'noopener noreferrer', ...attrs }, text, h('span', { class: 'sr' }, ' (새 창)'));
  const i = document.createElement('span');
  i.innerHTML = '<svg class="nw" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  a.append('\u2060', i.firstChild);  // 단어 잇기: 아이콘만 다음 줄로 떨어지지 않게
  return a;
}
const isData = (src, type) => typeof src === 'string' && src.startsWith('data:' + type);
// 사람이 일반 링크로는 못 가는 경로 (메뉴에 없는 페이지를 찾은 방법)
const HIDDEN_HOW = how => /sitemap|robots|스크립트|클릭|더보기|새 창/.test(how || '');

// 광고 주변 캡처: 숨김 해제 전(위)·후(아래) 두 장을 겹쳐 놓고 막대·버튼으로 경계를 옮긴다. 인쇄할 때는 두 장을 나란히
function shotFig(sh, hidden) {
  // 광고 주변만 (좌우 240·위아래 160px), 이미지 경계 안으로
  const p = sh.pos, x = Math.max(0, p.x - 240), y = Math.max(0, p.y - 160);
  const R = { x, y, w: Math.min(sh.w, p.x + p.w + 240) - x, h: Math.min(sh.h, p.y + p.h + 160) - y };
  const pc = v => v * 100 + '%';
  const crop = (src, alt, mark) => h('div', { class: 'crop', style: 'aspect-ratio:' + R.w + '/' + R.h },
    h('img', { src, alt, style: 'width:' + pc(sh.w / R.w) + ';left:' + pc(-R.x / R.w) + ';top:' + pc(-R.y / R.h) }),
    mark ? h('div', { class: 'marker', style: 'left:' + pc((p.x - R.x) / R.w) + ';top:' + pc((p.y - R.y) / R.h) + ';width:' + pc(p.w / R.w) + ';height:' + pc(p.h / R.h) }, h('span', {}, '광고')) : null);
  const top = h('div', { class: 'top' }, crop(sh.before, '이용자에게 보이는 화면'));
  const knob = h('span', { class: 'knob' }); knob.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6-6 6 6 6M15 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const line = h('i', { class: 'line' }, knob);
  const after = hidden ? '숨김 해제' : '광고 위치';
  const st = h('div', { class: 'view', style: 'max-width:' + R.w + 'px', role: 'slider', tabindex: 0, 'aria-label': '전후 비교 경계. 왼쪽은 이용자에게 보이는 화면, 오른쪽은 ' + after, 'aria-valuemin': 0, 'aria-valuemax': 100 },
    crop(sh.after, hidden ? '숨김을 해제한 화면' : '광고 위치 표시', true), top, line,
    h('span', { class: 'tag l' }, '이용자에게 보이는 화면'), h('span', { class: 'tag r' }, after));
  let v = 100, stop = false;
  const set = n => { v = Math.max(0, Math.min(100, n)); top.style.clipPath = 'inset(0 ' + (100 - v) + '% 0 0)'; line.style.left = v + '%'; st.setAttribute('aria-valuenow', Math.round(v)); };
  const at = e => { const b = st.getBoundingClientRect(); set((e.clientX - b.left) / b.width * 100); };
  st.onpointerdown = e => { stop = true; try { st.setPointerCapture(e.pointerId); } catch (_) {} at(e); st.onpointermove = at; };
  st.onpointerup = st.onpointercancel = () => { st.onpointermove = null; };
  st.onkeydown = e => {
    const k = { ArrowLeft: v - 10, ArrowRight: v + 10, Home: 0, End: 100 }[e.key];
    if (k != null) { e.preventDefault(); stop = true; set(k); }
  };
  set(100);
  // 처음 보일 때 경계를 광고 바로 왼쪽까지 한 번 쓸어서 숨김이 풀리는 모습을 보여 준다
  const end = Math.max(8, Math.min(92, (p.x - R.x) / R.w * 100 - 4));
  const sweep = () => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return set(end);
    const t0 = performance.now() + 400;
    const step = t => { if (stop) return; const k = Math.min(1, Math.max(0, (t - t0) / 1200));
      set(100 - (100 - end) * k * k * (3 - 2 * k)); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  const img = st.querySelector('img');
  if (img.complete) sweep(); else img.onload = sweep;
  return h('div', { class: 'cmp' }, h('div', { class: 'lbls', 'aria-hidden': 'true' }, h('span', {}, '◀ 이용자에게 보이는 화면'), h('span', {}, after + ' ▶')), st,
    h('div', { class: 'both' }, h('img', { src: sh.before, alt: '' }), h('img', { src: sh.after, alt: '' })));
}

// 사이트 지도: 주소 폴더(섹션)마다 카드, 페이지 하나를 점 하나로. 점 색은 그 페이지에서 가장 높은 위험도
function siteMap(D) {
  const RISKS = ['심각', '위험', '참고'], per = {};
  for (const g of D.groups) for (const i of g.items) {
    const p = per[i.url] || (per[i.url] = { n: 0, risk: g.risk });
    p.n++; if (RISKS.indexOf(g.risk) < RISKS.indexOf(p.risk)) p.risk = g.risk;
  }
  const secOf = u => { try { const s = new URL(u).pathname.split('/').filter(Boolean); s.pop(); return '/' + s.join('/') + (s.length ? '/' : ''); } catch (e) { return '/'; } };
  const short = u => { try { const x = new URL(u); return (x.pathname + x.search) || '/'; } catch (e) { return u; } };
  const secs = new Map();
  for (const p of D.pages) { const k = secOf(p.url); if (!secs.has(k)) secs.set(k, []); secs.get(k).push({ url: p.url, how: (p.path.at(-1) || [])[1] || '', ...(per[p.url] || { n: 0 }) }); }
  const list = [...secs].map(([k, ps]) => ({ k, ps: ps.sort((a, b) => b.n - a.n), hits: ps.reduce((a, p) => a + p.n, 0), hp: ps.filter(p => p.n).length, worst: RISKS.find(r => ps.some(p => p.risk === r)) }))
    .sort((a, b) => b.hits - a.hits || b.ps.length - a.ps.length);
  // 점 위 도움말: 마우스를 따라다닌다 (키보드 초점이면 점 아래). 스크린 리더는 aria-label을 읽는다
  const tip = $('.maptip') || document.body.appendChild(h('div', { class: 'maptip', hidden: true, 'aria-hidden': 'true' }));
  const text = p => short(p.url) + (p.n ? ' — ' + p.risk + ' ' + p.n + '건' : ' — 검출 없음') + (HIDDEN_HOW(p.how) ? ' · ' + p.how + '(으)로 찾음' : '');
  const place = (x, y) => { const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, innerWidth - w - 8) + 'px'; tip.style.top = (y + 18 + hh > innerHeight ? y - hh - 10 : y + 18) + 'px'; };
  const show = (p, x, y) => { tip.textContent = text(p); tip.hidden = false; place(x, y); };
  const hide = () => { tip.hidden = true; };
  // 점은 마우스용 그림이다 (12px라 누르기 어렵다). 키보드·스크린 리더는 카드 아래 검출 페이지 목록을 쓴다
  const dot = p => h('a', { href: p.url, target: '_blank', rel: 'noopener noreferrer', tabindex: -1, class: [p.risk, HIDDEN_HOW(p.how) && 'off'].filter(Boolean).join(' '),
    onmouseenter: e => show(p, e.clientX, e.clientY), onmousemove: e => place(e.clientX, e.clientY), onmouseleave: hide });
  const hits = list.flatMap(s => s.ps.filter(p => p.n));
  return [
    h('div', { class: 'maplegend' }, RISKS.map(r => h('span', {}, h('i', { class: r }), r)), h('span', {}, h('i'), '검출 없음'),
      h('span', {}, h('i', { class: 'off', style: 'background:none' }), '메뉴 밖에서 찾은 페이지 (sitemap·스크립트·클릭 등)')),
    h('div', { class: 'secs' }, list.map(s => h('div', { class: 'sec' + (s.worst ? ' ' + s.worst : '') },
      h('h3', {}, s.k, h('span', {}, s.ps.length + '쪽')),
      // 검출 수 + 이 섹션 페이지 중 검출된 비율
      h('div', { class: 'num' }, s.hits, h('small', {}, '건 검출'), s.worst ? [' ', h('span', { class: 'badge b-' + s.worst }, s.worst)] : null),
      h('div', { class: 'ratio', role: 'img', 'aria-label': s.ps.length + '쪽 중 ' + s.hp + '쪽에서 검출' }, h('i', { style: 'width:' + (s.hp / s.ps.length * 100) + '%' })),
      h('p', { class: 'rl' }, s.hp + '/' + s.ps.length + '쪽에서 검출'),
      h('div', { class: 'dots', 'aria-hidden': 'true' }, s.ps.map(dot)),
      s.hp ? h('details', { class: 'maphits noprint' }, h('summary', {}, '검출 페이지 ' + s.hp + '쪽 보기'),
        h('ol', {}, s.ps.filter(p => p.n).map(p => h('li', {}, h('span', { class: 'badge b-' + p.risk }, p.risk + ' ' + p.n), ' ', newWin(p.url, short(p.url), { title: p.url }))))) : null))),
    // 인쇄에는 점 위 주소가 안 보이므로 검출 페이지 주소를 덧붙인다
    hits.length ? h('ol', { class: 'printonly urls' }, hits.map(p => h('li', {}, p.risk + ' ' + p.n + '건 · ' + p.url))) : null];
}

// 판정 근거(detect.py reason 문구) → 그 근거를 만든 CSS 속성
const REASON_CSS = {
  'display': ['display'], 'font-size': ['font-size'], '글자 박스': ['width', 'height', 'font-size'],
  '문서 밖 좌표': ['position', 'left', 'top', 'transform', 'text-indent'], '잘림': ['overflow', 'clip', 'clip-path', 'width', 'height'],
  'visibility': ['visibility'], 'opacity': ['opacity'], '글자색 투명': ['color'], '대비': ['color', 'background-color'],
};
const DEFAULT_CSS = ['none', 'auto', 'normal', 'visible', 'static', '0px', 'block', 'inline', '1', 'rgba(0, 0, 0, 0)'];
// HTML 조각에서 해당 속성 선언(속성: 값)을 표시한다. 글자는 모두 텍스트 노드로만 넣는다
function markCss(html, keys) {
  if (!keys.length) return html;
  const re = new RegExp('(' + keys.map(k => k.replace(/[-]/g, '\\-')).join('|') + ')\\s*:\\s*[^;"\'>]+', 'gi');
  const out = []; let i = 0;
  for (const m of html.matchAll(re)) { out.push(html.slice(i, m.index), h('mark', { class: 'bad' }, m[0])); i = m.index + m[0].length; }
  out.push(html.slice(i));
  return out;
}

// R5·R6·R7: 묶음 하나의 근거 상세
function detail(g, D) {
  const odd = new Map(g.chars.map(([c, code, name]) => [c, code + ' ' + name]));
  const raw = h('span');
  let buf = '';
  for (const c of g.evidence_text) {
    if (odd.has(c)) { if (buf) raw.append(buf); buf = ''; raw.append(h('mark', { title: odd.get(c) }, c)); }
    else buf += c;
  }
  if (buf) raw.append(buf);
  const hidden = g.technique === 'TRANSPARENT' || g.technique === 'OFFSCREEN';
  const sh = g.shot || {};
  const copy = (t, b) => {
    const done = () => { b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => prompt('선택자', t));
    else prompt('선택자', t);
  };
  const norm = g.norm && g.norm !== g.evidence_text ? g.norm : '';
  const link = u => /^https?:/i.test(u) ? newWin(u, u) : u;
  const sel = i => { const b = h('button', { type: 'button', class: 'noprint xs', 'aria-label': i.id + ' 선택자 복사' }, '복사'); b.onclick = () => copy(i.location, b);
    return [h('code', {}, i.location), ' ', b]; };
  // 표 한 행에 한 가지 (항목 머리에 있는 광고 문구·기법 이름은 되풀이하지 않는다)
  const row = (k, ...v) => h('tr', {}, h('th', { scope: 'row' }, k), h('td', {}, ...v));
  const one = g.items.length === 1;
  const path = g.items[0].path || [];
  // 판정 근거(reason)에 해당하는 이 요소의 CSS 속성만 (상위 요소가 숨긴 경우는 근거 행으로 충분)
  const reasons = g.reasons || [[g.technique, g.tech_label, g.reason]];
  const keys = [...new Set(Object.entries(REASON_CSS).filter(([w]) => reasons.some(r => (r[2] || '').includes(w))).flatMap(([, k]) => k))];
  const bad = hidden ? keys.filter(k => g.style && g.style[k] && !DEFAULT_CSS.includes(g.style[k])).map(k => [k, g.style[k]]) : [];
  const tech = [
    bad.length && ['숨긴 속성', h('div', { class: 'props' }, bad.map(([k, v]) => h('span', {}, k + ': ' + v)))],
    g.chars.length && ['바꾼 글자', h('div', { class: 'swap' }, g.chars.map(([c, code, name]) => h('span', { title: name }, h('b', {}, c.trim() ? c : '␣'), h('small', {}, code))))],
    g.html && ['HTML', h('pre', {}, markCss(g.html, bad.map(x => x[0])))],
    path.length && ['찾아간 경로', h('div', { class: 'crumb' }, path.map(([u, how], i) => [i ? h('i', { 'aria-hidden': 'true' }, '→') : null,
      how ? h('span', { class: 'how' + (HIDDEN_HOW(how) ? ' hid' : '') }, how) : null,
      newWin(u, (() => { try { const x = new URL(u); return (x.pathname + x.search) || '/'; } catch (e) { return u; } })(), { title: u })]))]].filter(Boolean);
  return h('div', { class: 'det' },
    h('table', { class: 'fact' },
      row('증거 화면', isData(sh.before, 'image/') && sh.pos ? shotFig(sh, hidden) : h('span', { class: 'muted' }, sh.error || '캡처 없음')),
      reasons.map(([t, label, why]) => row(t === 'TRANSPARENT' || t === 'OFFSCREEN' ? '숨김 방법' : '변형 방법',
        reasons.length > 1 ? h('div', { class: 'k' }, label) : null, why ? h('b', {}, why) : null, why ? ' — ' : null, TECH_DESC[t])),
      row('광고 근거',
        g.chars.length ? [h('div', { class: 'raw' }, raw), norm ? h('div', {}, '풀어 읽으면: ', h('b', {}, norm)) : null] : null,
        g.kw.length ? h('div', { class: 'chips' }, '키워드 ', g.kw.map(k => h('span', {}, k))) : (g.chars.length ? null : '-')),
      one ? [row('페이지', link(g.items[0].url)), row('요소 위치', sel(g.items[0]))]
        : row('발견 위치 ' + g.items.length + '곳', h('ol', { class: 'locs' }, g.items.map(i => h('li', {}, link(i.url), h('br'), sel(i),
          techsOf(g).length > 1 ? h('span', { class: 'muted' }, ' ' + itemTechs(g, i).map(t => TECH_SHORT[t]).join('·')) : null)))),
      row('조치', h('a', { href: '#s-guide', onclick: e => { e.preventDefault(); const el = document.getElementById('s-guide'); el.scrollIntoView(); el.focus({ preventScroll: true }); } }, '조치 안내 보기 (' + g.cause + ') →')),
      tech.length ? row('기술 상세', h('div', { class: 'why' }, tech.map(t => h('div', {}, h('div', { class: 'k' }, t[0]), t[1])))) : null,
      row('조치 상태', statusBox(g, D)),
      row('기록', '지문 ' + g.fp + ' · 최초 발견 ' + fmtTime(g.first_seen) + (g.change ? ' · 지난 점검 대비 ' + g.change : ''))));
}

// 인쇄 전에 아직 그리지 않은 상세를 모두 그린다 (기관 보고용 출력에 근거가 빠지지 않게)
window.addEventListener('beforeprint', () => document.querySelectorAll('button.gh[aria-expanded=false]').forEach(b => {
  const p = document.getElementById(b.getAttribute('aria-controls')); if (p && !p.firstChild) { b.click(); b.click(); } }));

// 조치 상태: 앱에서는 고르고 메모를 남겨 status.json에 저장, 보고서 파일에서는 읽기만
const stOf = g => (g.status && g.status.status) || '미조치';
function statusBox(g, D) {
  const st = g.status || {};
  if (!APP() || !D.statuses) return [h('b', {}, stOf(g)), st.owner ? ' · ' + st.owner : '', st.memo ? ' · ' + st.memo : '', st.at ? h('span', { class: 'muted' }, ' (' + fmtTime(st.at) + ')') : ''];
  const id = 'st-' + g.fp;
  const sel = h('select', { id, 'aria-label': '조치 상태' }, D.statuses.map(t => h('option', { value: t, selected: t === stOf(g) }, t)));
  const owner = h('input', { type: 'text', class: 'owner', value: st.owner || '', placeholder: '담당자', 'aria-label': '담당자', maxlength: 50 });
  const memo = h('input', { type: 'text', value: st.memo || '', placeholder: '메모', 'aria-label': '조치 메모', maxlength: 500 });
  const msg = h('span', { class: 'muted', 'aria-live': 'polite' });
  const save = h('button', { type: 'button' }, '저장');
  save.onclick = () => Promise.resolve(api('set_status', g.fp, sel.value, memo.value, owner.value, infoOf(g))).then(ok => {
    if (!ok) { msg.textContent = '저장하지 못했습니다'; return; }
    g.status = { status: sel.value, memo: memo.value, owner: owner.value, at: new Date().toISOString() };
    const l = document.getElementById('stl-' + g.fp); if (l) l.textContent = sel.value;
    msg.textContent = '저장했습니다';
  });
  return h('div', { class: 'stbox' }, sel, owner, memo, save, msg);
}

// ---------- 점검 기록 (앱 전용): records/index.json 목록을 첫 화면 아래에 → 누르면 그때 결과 화면 ----------
const verdict = r => r.error ? h('span', { class: 'badge b-fail' }, '점검 실패')
  : r.findings ? h('span', { class: 'badge b-' + (RISK_ORDER.find(k => r.risk[k]) || '참고') }, '검출 ' + r.kinds + '종 · ' + r.findings + '곳')
  : h('span', { class: 'badge b-ok' }, '광고 없음');
const newScan = () => { $('#go').disabled = false; loadRecent(); swap(() => { show('start'); window.scrollTo(0, 0); }); };
// 기록을 사이트(호스트)별로 묶는다. records/index.json은 최신이 앞이라 묶은 뒤에도 각 사이트의 [0]이 최근 점검
const hostOf = u => { try { return new URL(u).host; } catch (e) { return u; } };
const bySite = R => { const m = new Map(); R.forEach(r => { const k = hostOf(r.entry_url); m.has(k) ? m.get(k).push(r) : m.set(k, [r]); }); return m; };
const fileOf = m => m.started_at.replace(/\D/g, '').slice(0, 14) + '.html';  // report.save_record와 같은 규칙
// 같은 사이트 다시 진단: 그 주소를 넣고 시작한 것과 같다 (설정은 첫 화면 값)
const rescan = url => { $('#url').value = url; start(); };
// 예약 점검 (작업 스케줄러). 사이트 하나에 예약 하나: 같은 사이트로 다시 저장하면 바뀐다 (main.add_schedule)
const DAY_KO = { MON: '월', TUE: '화', WED: '수', THU: '목', FRI: '금', SAT: '토', SUN: '일' };
const UNIT = { day: '일', week: '주', month: '개월' }, FREQ_KO = { day: '매일', week: '매주', month: '매월' };
const ruleOf = s => (s.every > 1 ? s.every + UNIT[s.freq] + '마다' : FREQ_KO[s.freq])
  + (s.freq === 'week' ? ' ' + s.days.map(d => DAY_KO[d]).join('·') : s.freq === 'month' ? ' ' + s.date + '일' : '') + ' ' + s.time;
const schipOf = s => s.next ? h('span', { class: 'schip', title: '다음 실행 ' + s.next }, '⏱ ' + ruleOf(s) + ' · 다음 ' + s.next)
  : h('span', { class: 'schip miss', title: '작업 스케줄러에서 지워졌습니다. 예약을 다시 저장하세요' }, '⏱ ' + ruleOf(s) + ' · 작업 스케줄러에 없음');
// 예약 편집 폼: 반복 · 간격 · 요일/날짜 · 시각 · 시간 상한. 새 예약이면 주소 칸, 기존 예약이면 삭제 버튼
function schedEditor(s, done, withUrl) {
  let freq = s.freq || 'week';
  const row = (name, ...el) => h('div', { class: 'scf' }, h('span', {}, name), ...el);
  const url = withUrl ? h('input', { class: 'scurl', placeholder: 'https://www.example.go.kr', 'aria-label': '주소', autocomplete: 'url', spellcheck: 'false' }) : null;
  if (url) url.value = s.url || '';
  const seg = h('div', { class: 'scseg', role: 'group', 'aria-label': '반복' }, Object.entries(FREQ_KO).map(([v, k]) => h('button', { type: 'button', value: v, onclick: () => { freq = v; sync(); } }, k)));
  const every = h('select', { 'aria-label': '간격' }), time = h('input', { type: 'time', 'aria-label': '시각' });
  time.value = s.time || '10:00';
  const days = h('fieldset', { class: 'scdays' }, h('legend', { class: 'sr' }, '요일'),
    Object.entries(DAY_KO).map(([v, k]) => h('label', {}, h('input', { type: 'checkbox', value: v, checked: (s.days || ['MON']).includes(v) || null }), k)));
  const date = h('select', { 'aria-label': '날짜' }, Array.from({ length: 28 }, (_, i) => h('option', { value: i + 1, selected: i + 1 === (s.date || 1) || null }, (i + 1) + '일')));
  const mins = s.minutes || +$('#minutes').value || 20;
  const limit = h('select', { 'aria-label': '시간 상한' }, [5, 10, 15, 20, 25].map(m => h('option', { value: m, selected: m === mins || null }, m + '분')));
  const dayRow = row('요일', days), dateRow = row('날짜', date);
  const msg = h('div', { class: 'hint', role: 'status' }), save = h('button', { class: 'primary', type: 'submit' }, '저장');
  const sync = () => {
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.value === freq));
    const keep = +every.value || s.every || 1;
    every.replaceChildren(...Array.from({ length: 12 }, (_, i) => h('option', { value: i + 1, selected: i + 1 === keep || null }, (i + 1) + UNIT[freq] + '마다')));
    dayRow.hidden = freq !== 'week'; dateRow.hidden = freq !== 'month';
  };
  sync();
  const send = (call, ...args) => {
    save.disabled = true; msg.className = 'hint'; msg.textContent = '';
    Promise.resolve(api(call, ...args)).then(r => {
      save.disabled = false;
      if (r && r.error) { msg.className = 'hint err'; msg.textContent = r.error; return; }
      done(true);
    });
  };
  const submit = e => {
    e.preventDefault();
    send('add_schedule', { url: url ? url.value.trim() : s.url, freq, every: +every.value, time: time.value, date: +date.value, minutes: +limit.value,
      days: [...days.querySelectorAll('input:checked')].map(x => x.value) });
  };
  return h('form', { class: 'in', onsubmit: submit }, url ? row('주소', url) : null, row('반복', seg), row('간격', every), dayRow, dateRow, row('시각', time), row('시간 상한', limit),
    h('div', { class: 'dfoot' }, s.id ? h('button', { class: 'lnk', type: 'button', onclick: () => confirm(hostOf(s.url) + ' 예약을 삭제할까요?') && send('del_schedule', s.id) }, '예약 삭제') : null,
      msg, h('button', { type: 'button', onclick: () => done(false) }, '취소'), save));
}
// 예약 창: "+ 예약 추가"(주소 입력)와 줄의 "예약"(그 사이트 고정)이 같이 쓴다
function openSched(sc) {
  const isNew = !sc;
  const f = schedEditor(sc || { url: $('#url').value.trim() }, ok => { $('#scdlg').close(); if (ok) loadRecent(); }, isNew);
  $('#scdlg-t').textContent = isNew ? '예약 점검' : hostOf(sc.url);
  $('#scbody').replaceChildren(h('div', { class: 'sced' }, f));
  $('#scdlg').showModal();
  if (isNew && !f.querySelector('.scurl').value) f.querySelector('.scurl').focus();
}
// 홈 = 사이트 현황판. 사이트 하나 = 한 줄(최근 결과 · 추이 · 지난번 대비 · 예약 · 다시 진단), 끝에 닿을 때마다 20곳씩 더 그린다.
// 예약만 있고 아직 점검하지 않은 사이트도 한 줄 (맨 앞)
let recentIO;
function loadRecent() {
  const root = $('#recent');
  if (recentIO) recentIO.disconnect();
  Promise.all([api('records'), api('schedules')]).then(([R, L]) => {
    const add = h('button', { class: 'xs', type: 'button', 'aria-haspopup': 'dialog', onclick: () => openSched() }, '+ 예약 추가');
    const sch = new Map(L.map(x => [hostOf(x.url), x]));
    const S = [...[...sch.keys()].filter(k => !R.some(r => hostOf(r.entry_url) === k)).map(k => [k, []]), ...bySite(R)];
    if (!S.length) return root.replaceChildren(h('div', { class: 'rtop' }, h('span', {}, '사이트 현황'), add),
      h('p', { class: 'muted' }, '입력한 주소에서 시작해 하위 페이지, 게시글, 댓글, iframe 안까지 살펴보고 숨겨지거나 변형된 불법광고를 찾습니다. 결과는 보고서·Excel·제출 파일로 프로그램 폴더에 저장됩니다.'));
    const ul = h('ul', {}), end = h('div', { 'aria-hidden': 'true' });
    let n = 0;
    const row = ([host, rs]) => {
      const r = rs[0], ok = rs.filter(x => !x.error), prev = ok[1], cur = ok[0], sc = sch.get(host);
      const d = cur && prev ? cur.kinds - prev.kinds : null;
      const chg = !cur || !prev ? h('span', { class: 'chg' }, rs.length > 1 ? '' : rs.length ? '첫 점검' : '')
        : h('span', { class: 'chg' + (d < 0 ? ' down' : d > 0 ? ' up' : '') }, d ? (d > 0 ? '+' : '−') + Math.abs(d) + '종' : '변화 없음');
      const hist = ok.slice(0, 5).reverse(), top = Math.max(1, ...hist.map(x => x.kinds));  // 왼쪽이 오래된 점검
      const url = r ? r.entry_url : sc.url;
      const li = h('li', { class: 'srow' },
        h('button', { class: 'sopen', type: 'button', disabled: !r || null, title: r ? url + ' 최근 결과 열기' : url, onclick: () => r && openRecord(r.file) },
          h('span', { class: 'sn' }, h('b', {}, host),
            h('span', {}, r ? [fmtTime(r.finished_at).slice(0, 16) + (rs.length > 1 ? ' · ' + rs.length + '회' : '') + (r.stopped ? ' · 중단' : ''), verdict(r)] : '아직 점검 안 함'),
            sc ? schipOf(sc) : null),
          h('span', { class: 'spark', 'aria-hidden': 'true' }, hist.map(x => h('i', { class: x.kinds ? null : 'z', style: 'height:' + Math.round(26 * x.kinds / top) + 'px' }))),
          chg),
        h('span', { class: 'acts' }, h('button', { class: 'xs', type: 'button', 'aria-haspopup': 'dialog', onclick: () => openSched(sc || { url }) }, '예약'),
          h('button', { class: 'xs', type: 'button', onclick: () => rescan(url) }, r ? '다시 진단' : '지금 점검')));
      return li;
    };
    const more = () => { ul.append(...S.slice(n, n += 20).map(row)); if (n >= S.length && recentIO) recentIO.disconnect(); };
    root.replaceChildren(h('div', { class: 'rtop' }, h('span', {}, '사이트 현황 ' + S.length + '곳' + (L.length ? ' · 예약 ' + L.length : '') + ' · 점검 ' + R.length + '회'), add), ul, end);
    more();
    if (n < S.length) { recentIO = new IntersectionObserver(es => es[0].isIntersecting && more(), { rootMargin: '400px' }); recentIO.observe(end); }
  }).catch(() => root.replaceChildren());
}
// 결과 화면 진단 바 (앱 전용). 점검 이력은 같은 사이트의 기록만, 고르면 그때 결과로 바뀐다
function diagBar(m) {
  const host = hostOf(m.entry_url), cur = fileOf(m);
  const hist = h('select', { 'aria-label': '점검 이력', onchange: e => openRecord(e.target.value), hidden: true });
  Promise.resolve(api('records')).then(R => {
    const rs = bySite(R).get(host) || [];
    if (rs.length < 2) return;
    hist.replaceChildren(...rs.map(r => h('option', { value: r.file, selected: r.file === cur || null },
      fmtTime(r.finished_at).slice(5, 16) + ' · ' + (r.error ? '실패' : r.findings ? r.kinds + '종' : '광고 없음'))));
    hist.title = '점검 이력 ' + rs.length + '회'; hist.hidden = false;
  }).catch(() => {});
  return h('div', { class: 'dbar noprint' },
    h('div', { class: 'ds' }, h('b', { title: m.entry_url }, host), h('span', {}, fmtTime(m.finished_at).slice(0, 16) + ' 점검')),
    hist,
    h('button', { class: 'primary', type: 'button', onclick: newScan }, ICON_BACK(), '다시 진단'));
}
const ICON_BACK = () => { const e = document.createElement('span'); e.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; return e.firstChild; };
const RISK_ORDER = ['심각', '위험', '참고'];
function openRecord(file) {
  Promise.resolve(api('record', file)).then(D => { if (!D) return; renderReport(D); show('result'); window.scrollTo(0, 0); });
}

// 맨 위로 버튼: 화면 높이만큼 내려가면 보인다. 누르면 맨 위로 가고 초점은 본문 시작으로
addEventListener('scroll', () => $('#totop').classList.toggle('on', scrollY > innerHeight * 0.8), { passive: true });
$('#totop').onclick = () => {
  scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  $('#main').setAttribute('tabindex', '-1'); $('#main').focus({ preventScroll: true });
};
// 시작: 보고서 파일이면 내장 JSON을, 앱이면 시작 화면을
const EMBED = JSON.parse($('#data').textContent);
if (EMBED) { document.title = 'adGuard 점검 보고서 — ' + EMBED.meta.entry_url; renderReport(EMBED); show('result'); }
else {
  document.title = 'adGuard 불법광고 탐지'; show('start');
  const boot = () => { loadAi(); loadRecent(); };
  if (window.pywebview && window.pywebview.api && window.pywebview.api.ai) boot();
  else if (location.protocol.startsWith('http')) boot(); else window.addEventListener('pywebviewready', boot);
}
