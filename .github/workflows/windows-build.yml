name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: exe 빌드 (onedir, UPX 끔)
        run: pyinstaller --noconfirm --onedir --noupx --name adguard --add-data "app/data;data" app/main.py

      - name: .env 예시를 exe 옆에 (심사위원이 키만 넣으면 됨)
        run: |
          copy app\.env.example dist\adguard\.env.example
          copy app\data\THIRD_PARTY_NOTICES.txt dist\adguard\THIRD_PARTY_NOTICES.txt

      - name: 빌드 크기
        shell: pwsh
        run: |
          "{0:N1} MB (브라우저 제외)" -f ((Get-ChildItem dist\adguard -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem dist\adguard\_internal -Directory | Where-Object Name -match 'webview|pythonnet|clr|playwright' | ForEach-Object {
            "{0}: {1:N1} MB" -f $_.Name, ((Get-ChildItem $_.FullName -Recurse | Measure-Object Length -Sum).Sum / 1MB) }

      - name: Chromium headless shell을 exe 옆 browsers 폴더에 설치
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist\adguard\browsers
        run: python -m playwright install --only-shell chromium

      - name: 한글·공백 경로로 복사해서 S0 사이트로 실행 (명령줄 + WebView2 창)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $dest = "C:\테스트 폴더\adguard"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item -Recurse dist\adguard $dest
          $srv = Start-Process python -ArgumentList "eval/scenarios/S0-empty/serve.py" -PassThru
          Start-Sleep -Seconds 3
          $out = & "$dest\adguard.exe" "http://127.0.0.1:8100/"
          if ($LASTEXITCODE -ne 0) { throw "adguard.exe 실패: $LASTEXITCODE" }
          $out
          if (-not ($out -match "동봉 Chromium")) { throw "동봉 Chromium이 아닌 브라우저로 실행됨" }
          foreach ($f in "report.html", "result.csv") { if (-not (Test-Path "$dest\$f")) { throw "$f 없음" } }
          Remove-Item "$dest\result.json", "$dest\report.html"
          $gui = & "$dest\adguard.exe" --smoke-gui "http://127.0.0.1:8100/"
          $gui
          if (-not ($gui -match "UI: WebView2") -or -not ($gui -match "동봉 Chromium")) { throw "WebView2 창 모드 실패" }
          if (-not ($gui -match "보고서 저장") -or -not (Test-Path "$dest\report.html")) { throw "창 모드 보고서 실패" }
          $env:PLAYWRIGHT_BROWSERS_PATH = "$dest\browsers"  # 동봉 headless shell로 보고서를 열어 본다
          python eval/reportcheck.py "$dest\report.html"
          if ($LASTEXITCODE -ne 0) { throw "report.html 스크립트 오류" }
          Stop-Process -Id $srv.Id
          python eval/validate.py "$dest\result.json"
          if ($LASTEXITCODE -ne 0) { throw "result.json 스키마 위반" }
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['findings']==[], d" "$dest\result.json"
          # 탐지 회귀: S1을 exe로 점검하고 채점해 100점(재현율·정밀도 100%)인지 본다
          $srv = Start-Process python -ArgumentList "eval/scenarios/S1-baseline/serve.py" -PassThru
          Start-Sleep -Seconds 3
          & "$dest\adguard.exe" --no-report "http://127.0.0.1:8110/"
          if ($LASTEXITCODE -ne 0) { throw "S1 adguard.exe 실패: $LASTEXITCODE" }
          $env:PYTHONIOENCODING = "utf-8"
          python eval/scorer/score.py S1-baseline "$dest\result.json" --json s1.json
          Stop-Process -Id $srv.Id
          python -c "import json; r=json.load(open('s1.json',encoding='utf-8')); print(r['hit'], r['answers'], r['recall'], r['precision']); assert r['recall'] == r['precision'] == 1 and r['answers'] > 0"
          if ($LASTEXITCODE -ne 0) { throw "S1 점수가 100점이 아님" }

      - name: 예약 점검 (작업 스케줄러 등록·조회·삭제, exe --scheduled)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -c "import sys; sys.path.insert(0, 'app'); import main; r = main.add_schedule({'url': 'http://127.0.0.1:8100/', 'freq': 'week', 'every': 2, 'time': '03:00', 'days': ['MON', 'THU']}); assert not r, r; sid = main.schedules()[0]['id']; n = main.next_runs(); print(n); assert sid in n, n; main.del_schedule(sid); assert sid not in main.next_runs() and not main.schedules()"
          if ($LASTEXITCODE -ne 0) { throw "작업 스케줄러 등록·삭제 실패" }
          $dest = "C:\테스트 폴더\adguard"
          '[{"id": "ci000001", "url": "http://127.0.0.1:8100/", "freq": "day", "every": 1, "time": "03:00", "days": [], "date": 1, "minutes": 5}]' | Set-Content -Encoding utf8NoBOM "$dest\schedules.json"
          Remove-Item -Recurse -Force "$dest\records" -ErrorAction SilentlyContinue
          $srv = Start-Process python -ArgumentList "eval/scenarios/S0-empty/serve.py" -PassThru
          Start-Sleep -Seconds 3
          & "$dest\adguard.exe" --scheduled ci000001
          Stop-Process -Id $srv.Id
          if (-not (Test-Path "$dest\records\index.json")) { throw "예약 점검 기록 없음" }
          Get-Content "$dest\logs\*.log" -Tail 3

      - name: 배포 zip (dist에서는 실행하지 않았으므로 .env·결과 파일이 없다) + SHA-256
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\adguard -Force | Where-Object Name -match '^(\.env|\.env\.txt|result.*\.json|report\.html|result\.csv|history\.json|status\.json|schedules\.json|records|logs|cache)$'
          if ($bad) { throw "배포 폴더에 실행 산출물이 있음: $($bad.Name -join ', ')" }
          Compress-Archive -Path dist\adguard -DestinationPath adguard.zip
          (Get-FileHash adguard.zip -Algorithm SHA256).Hash | Tee-Object adguard.zip.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: adguard-windows
          path: |
            adguard.zip
            adguard.zip.sha256.txt
          compression-level: 0
