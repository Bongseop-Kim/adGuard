name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: exe 빌드 (onedir, UPX 끔)
        run: pyinstaller --noconfirm --onedir --noupx --name adguard --add-data "app/data;data" app/main.py

      - name: 빌드 크기
        shell: pwsh
        run: |
          "{0:N1} MB (브라우저 제외)" -f ((Get-ChildItem dist\adguard -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem dist\adguard\_internal -Directory | Where-Object Name -match 'webview|pythonnet|clr|playwright' | ForEach-Object {
            "{0}: {1:N1} MB" -f $_.Name, ((Get-ChildItem $_.FullName -Recurse | Measure-Object Length -Sum).Sum / 1MB) }

      - name: Chromium headless shell·ffmpeg(재현 영상)를 exe 옆 browsers 폴더에 설치
        env:
          PLAYWRIGHT_BROWSERS_PATH: dist\adguard\browsers
        run: python -m playwright install --only-shell chromium ffmpeg

      - name: 한글·공백 경로로 복사해서 S0 사이트로 실행 (명령줄 + WebView2 창)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $dest = "C:\테스트 폴더\adguard"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item -Recurse dist\adguard $dest
          $srv = Start-Process python -ArgumentList "eval/scenarios/S0-empty/serve.py" -PassThru
          Start-Sleep -Seconds 3
          $out = & "$dest\adguard.exe" "http://127.0.0.1:8100/"
          if ($LASTEXITCODE -ne 0) { throw "adguard.exe 실패: $LASTEXITCODE" }
          $out
          if (-not ($out -match "동봉 Chromium")) { throw "동봉 Chromium이 아닌 브라우저로 실행됨" }
          foreach ($f in "report.html", "result.csv") { if (-not (Test-Path "$dest\$f")) { throw "$f 없음" } }
          Remove-Item "$dest\result.json", "$dest\report.html"
          $gui = & "$dest\adguard.exe" --smoke-gui "http://127.0.0.1:8100/"
          $gui
          if (-not ($gui -match "UI: WebView2") -or -not ($gui -match "동봉 Chromium")) { throw "WebView2 창 모드 실패" }
          if (-not ($gui -match "보고서 저장") -or -not (Test-Path "$dest\report.html")) { throw "창 모드 보고서 실패" }
          Stop-Process -Id $srv.Id
          python eval/validate.py "$dest\result.json"
          if ($LASTEXITCODE -ne 0) { throw "result.json 스키마 위반" }
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['findings']==[], d" "$dest\result.json"

      - uses: actions/upload-artifact@v4
        with:
          name: adguard-windows
          path: dist/adguard
