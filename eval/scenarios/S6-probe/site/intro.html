<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>학습관 소개</title>
<style>
body{font-family:sans-serif;background:#fff;color:#222}
@media screen { .m-hide{display:none} }
@keyframes fadeout{to{opacity:0}}
.fade{animation:fadeout .1s forwards}
.cover-box{position:relative;height:40px}
</style></head>
<body>
<h2>학습관 소개</h2>
<p><a href="/">처음으로</a> <a href="/board/list">공지사항</a></p>
<!-- a06 details 닫힘 -->
<details class="more"><summary>더보기</summary><p class="det-p">토토 사이트 가입 @test_details</p></details>
<!-- a07 content-visibility:hidden -->
<div class="cv-wrap" style="content-visibility:hidden"><p class="cv-p">먹튀검증 메이저사이트 @test_cv</p></div>
<!-- a08 hidden=until-found -->
<div class="huf" hidden="until-found">안전놀이터 추천 @test_huf</div>
<!-- a09 미디어쿼리 -->
<p class="m-hide">룰렛 잭팟 이벤트 @test_mq</p>
<!-- a11 scale(0.01) -->
<p class="tiny" style="transform:scale(0.01)">성인방송 무료 @test_scale</p>
<!-- a12 단색 그라데이션 배경 위 같은 색 -->
<div class="band" style="background:linear-gradient(#1a3d6b,#1a3d6b);color:#1a3d6b;padding:8px">카지노 바로가기 @test_grad</div>
<!-- a14 애니메이션으로 opacity 0 -->
<p class="fade">토토 첫충 30% @test_anim</p>
<!-- a15 레거시 td bgcolor + font -->
<table class="legacy"><tr><td bgcolor="#000000"><font color="#000000">슬롯 잭팟 @test_font</font></td></tr></table>
<p>평생학습관은 시민 누구나 이용할 수 있습니다.</p>
</body></html>
