<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>약도</title>
<style>html,body{margin:0;background:#eef2f5;font-family:sans-serif;font-size:13px}.map{height:300px;position:relative}.pin{position:absolute;left:48%;top:45%;background:#d33;color:#fff;padding:2px 6px;border-radius:4px}.blind{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</head>
<body>
<div class="map">
  <span class="blind">지도: 가온시 중앙로 100 가온시설관리공단 위치</span>
  <span class="pin">가온시설관리공단</span>
</div>
</body>
</html>
